<!DOCTYPE html>
<html>
<head>
    <title>My Courses</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">
            My Courses
        </a>
    </div>
</nav>


<!-- Hero -->
<section class="text-center bg-light py-5">

    <h1>Learn New Skills</h1>

    <p>Learn useful courses online.</p>

    <button class="btn btn-primary">
        Explore Courses
    </button>

</section>


<!-- Courses -->
<section class="container py-5">

    <h2 class="text-center mb-4">
        Our Courses
    </h2>

    <div class="row g-4">

        <!-- Card 1 -->
        <div class="col-12 col-md-6 col-lg-4">

            <div class="card text-center p-3 h-100">

                <i class="bi bi-code-slash fs-1 text-primary"></i>

                <h3>Web Development</h3>

                <p>
                    Learn HTML, CSS and JavaScript.
                </p>

                <button class="btn btn-primary">
                    Learn More
                </button>

            </div>

        </div>


        <!-- Card 2 -->
        <div class="col-12 col-md-6 col-lg-4">

            <div class="card text-center p-3 h-100">

                <i class="bi bi-database fs-1 text-success"></i>

                <h3>Database</h3>

                <p>
                    Learn SQL and database management.
                </p>

                <button class="btn btn-success">
                    Learn More
                </button>

            </div>

        </div>


        <!-- Card 3 -->
        <div class="col-12 col-md-6 col-lg-4">

            <div class="card text-center p-3 h-100">

                <i class="bi bi-laptop fs-1 text-danger"></i>

                <h3>Programming</h3>

                <p>
                    Learn programming and coding.
                </p>

                <button class="btn btn-danger">
                    Learn More
                </button>

            </div>

        </div>

    </div>

</section>


<!-- Registration -->
<section class="bg-light py-5">

    <div class="container">

        <h2 class="text-center mb-4">
            Registration
        </h2>

        <form>

            <input
                type="text"
                class="form-control mb-3"
                placeholder="Your Name"
            >

            <input
                type="email"
                class="form-control mb-3"
                placeholder="Your Email"
            >

            <select class="form-select mb-3">

                <option>Select Course</option>
                <option>Web Development</option>
                <option>Database</option>
                <option>Programming</option>

            </select>

            <button class="btn btn-primary w-100">
                Register
            </button>

        </form>

    </div>

</section>


<!-- Footer -->
<footer class="bg-dark text-white text-center p-4">

    <p>
        © 2026 My Courses
    </p>

</footer>


</body>
</html>
