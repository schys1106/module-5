<!DOCTYPE html>
<html>

<head>

    <title>My Courses</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body>


<!-- Navbar -->

<nav class="bg-blue-600 text-white p-4">

    <div class="max-w-6xl mx-auto">

        <h1 class="text-2xl font-bold">
            My Courses
        </h1>

    </div>

</nav>


<!-- Hero -->

<section class="bg-gray-100 text-center py-16">

    <h1 class="text-4xl font-bold mb-4">
        Learn New Skills
    </h1>

    <p class="text-gray-600 mb-5">
        Learn useful courses online.
    </p>

    <button class="bg-blue-600 text-white px-5 py-2 rounded">
        Explore Courses
    </button>

</section>


<!-- Courses -->

<section class="max-w-6xl mx-auto p-5">

    <h2 class="text-3xl font-bold text-center mb-8">
        Our Courses
    </h2>


    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">


        <!-- Card 1 -->

        <div class="border rounded-lg p-5 text-center shadow">

            <div class="text-5xl">
                💻
            </div>

            <h3 class="text-2xl font-bold my-3">
                Web Development
            </h3>

            <p class="text-gray-600 mb-4">
                Learn HTML, CSS and JavaScript.
            </p>

            <button class="bg-blue-600 text-white px-4 py-2 rounded">
                Learn More
            </button>

        </div>


        <!-- Card 2 -->

        <div class="border rounded-lg p-5 text-center shadow">

            <div class="text-5xl">
                🗄️
            </div>

            <h3 class="text-2xl font-bold my-3">
                Database
            </h3>

            <p class="text-gray-600 mb-4">
                Learn SQL and database management.
            </p>

            <button class="bg-green-600 text-white px-4 py-2 rounded">
                Learn More
            </button>

        </div>


        <!-- Card 3 -->

        <div class="border rounded-lg p-5 text-center shadow">

            <div class="text-5xl">
                👩‍💻
            </div>

            <h3 class="text-2xl font-bold my-3">
                Programming
            </h3>

            <p class="text-gray-600 mb-4">
                Learn programming and coding.
            </p>

            <button class="bg-red-600 text-white px-4 py-2 rounded">
                Learn More
            </button>

        </div>

    </div>

</section>


<!-- Registration -->

<section class="bg-gray-100 py-10">

    <div class="max-w-2xl mx-auto p-5">

        <h2 class="text-3xl font-bold text-center mb-6">
            Registration
        </h2>


        <input
            type="text"
            placeholder="Your Name"
            class="w-full border p-3 rounded mb-3"
        >


        <input
            type="email"
            placeholder="Your Email"
            class="w-full border p-3 rounded mb-3"
        >


        <select class="w-full border p-3 rounded mb-3">

            <option>Select Course</option>

            <option>Web Development</option>

            <option>Database</option>

            <option>Programming</option>

        </select>


        <button class="w-full bg-blue-600 text-white p-3 rounded">
            Register
        </button>

    </div>

</section>


<!-- Footer -->

<footer class="bg-gray-900 text-white text-center p-5">

    <p>
        © 2026 My Courses
    </p>

</footer>


</body>
</html>
